dependencies:
  camera: ^0.11.4
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.6
  connectivity_plus: ^7.0.0
  drift: ^2.31.0
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_remote_config: ^6.1.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  http: ^1.6.0
  google_generative_ai: ^0.4.7
  google_maps_flutter: ^2.14.2
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  speech_to_text: ^7.3.0
  uuid: ^4.5.3
  workmanager: ^0.9.0+3
  shimmer: ^3.0.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  firebase_storage: ^13.0.6
  flutter_tts: ^4.2.5
  drift_flutter: ^0.2.8
  fl_chart: ^0.70.2
  table_calendar: ^3.2.0
