  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.11.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
